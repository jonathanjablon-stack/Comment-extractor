name: Test and deploy Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Install lockfile-pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright --version
          ./node_modules/.bin/playwright install --with-deps chromium
          ./node_modules/.bin/playwright install --list

      - name: Run full QA contract
        run: npm run qa

      - name: Verify deterministic Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/service-worker.js
          test -f dist/asset-manifest.json
          test -f dist/THIRD_PARTY_NOTICES.md
          test -z "$(find dist -type l -print -quit)"
          test -z "$(find dist -mindepth 1 -maxdepth 1 \
            ! -name index.html \
            ! -name service-worker.js \
            ! -name manifest.webmanifest \
            ! -name asset-manifest.json \
            ! -name THIRD_PARTY_NOTICES.md \
            ! -name assets \
            ! -name vendor \
            -print -quit)"
          ! grep -q '__CM_' dist/service-worker.js
          find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/comment-master-dist.sha256
          npm run build
          find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/comment-master-dist-rebuilt.sha256
          cmp /tmp/comment-master-dist.sha256 /tmp/comment-master-dist-rebuilt.sha256

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
